<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- La page est régénérée chaque minute par le suivi en direct : elle se recharge seule. -->
<meta http-equiv="refresh" content="60">
<title>Reprise après baisse</title>
<style>
  /* Mise en page : une colonne de lecture large, résumé d'abord, détail ensuite. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6877;
    --line: #dde1e7;
    --accent: #2b5d8c;
    --up: #1d7a4c;
    --down: #b23a3a;
    --chip: #e8eef5;
    --up-fill: #1f7f4f;
    --down-fill: #b33b3b;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
      --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; --chip: #1f2c3a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
    --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; --chip: #1f2c3a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 28px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .chip { background: var(--chip); color: var(--accent); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
  .spacer { flex: 1; }
  header a { color: var(--accent); font-weight: 600; }
  select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .meta { color: var(--muted); font-family: var(--font-data); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .plain { margin: 0; max-width: 70ch; }
  section { display: grid; gap: 4px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
  td { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  th.text, td.text { text-align: left; font-family: var(--font-ui); }
  td.name { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  td.symbol { font-weight: 700; font-family: var(--font-data); }
  tr:last-child td { border-bottom: none; }
  .up { color: var(--up); } .down { color: var(--down); }
  .funnel { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .step { display: grid; gap: 2px; min-width: 128px; padding: 8px 12px; border-left: 3px solid var(--line); }
  .step b { font-family: var(--font-data); font-size: 18px; font-variant-numeric: tabular-nums; }
  .step span { font-size: 12px; color: var(--muted); }
  .step.last { border-left-color: var(--accent); }
  .criteria { margin: 0; padding: 14px 18px 14px 34px; display: grid; gap: 4px; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .empty { padding: 28px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 28px; }
  .bubbles { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  .bubble { border-radius: 50%; display: grid; place-content: center; text-align: center; gap: 2px;
            color: #ffffff; padding: 10px; max-width: 100%; aspect-ratio: 1 / 1; }
  .bubble.up { background: var(--up-fill); } .bubble.down { background: var(--down-fill); }
  .bubble.flat { background: var(--muted); }
  .bubble .domain { font-size: 13px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
  .bubble .mean { font-family: var(--font-data); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bubble .count { font-size: 12px; opacity: 0.9; }
  .live-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--up); display: inline-block; }
  .pulse.off { background: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse:not(.off) { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  }
  .live td, .live th { text-align: center; padding: 8px 10px; }
  .live th.text, .live td.text { text-align: left; }
  .live td.text small { display: block; color: var(--muted); font-size: 12px; }
  .dot { width: 70px; height: 70px; border-radius: 50%; display: inline-grid; place-content: center;
         color: #ffffff; font-family: var(--font-data); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dot.up { background: var(--up-fill); } .dot.down { background: var(--down-fill); }
  .dot.flat { background: var(--muted); }
  .dot.none { background: none; border: 1px dashed var(--line); color: var(--muted); font-weight: 400; font-size: 11px; }
  .live button.sector { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0;
                        cursor: pointer; text-align: left; }
  .live button.sector:hover { color: var(--accent); }
  .live button.sector:focus-visible, .live th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .live tr.detail > td { padding: 0 0 14px; background: var(--bg); }
  .live table.stocks th, .live table.stocks td { padding: 6px 10px; font-size: 13px; text-align: right; }
  .live table.stocks .text { text-align: left; }
  .live table.stocks th.sortable { cursor: pointer; }
  .live table.stocks th.sortable:hover { color: var(--accent); }
  button.sector { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0;
                  cursor: pointer; text-align: left; }
  button.sector:hover { color: var(--accent); }
  button.sector:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  tr.chart-row > td { padding: 10px 12px 18px; background: var(--bg); text-align: left; white-space: normal; }
  .chart-box { display: grid; gap: 6px; max-width: 900px; }
  .chart-head { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--font-ui); font-size: 14px; }
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-data); }
  svg.chart .area { fill: var(--accent); fill-opacity: 0.1; stroke: none; }
  svg.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
  svg.chart .point { fill: var(--accent); }
  svg.chart .open { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.chart .today { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.chart .now.up { fill: var(--up); } svg.chart .now.down { fill: var(--down); } svg.chart .now.flat { fill: var(--muted); }
  svg.chart .now-label { font-size: 12px; font-weight: 700; font-family: var(--font-data); fill: var(--ink); }
  svg.chart .now-label.up { fill: var(--up); } svg.chart .now-label.down { fill: var(--down); }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title"></h1>
    <span class="chip" id="status"></span>
    <span class="spacer"></span>
    <a id="other-lang"></a>
    <label for="run" data-t="session"></label>
    <select id="run"></select>
    <label for="variant" data-t="version"></label>
    <select id="variant"></select>
  </header>

  <section>
    <h2 data-t="run_bubbles_title"></h2>
    <div class="panel bubbles" id="bubbles"></div>
    <p class="note" id="bubbles-note"></p>
  </section>

  <section>
    <h2 data-t="live_title"></h2>
    <div class="live-status" id="live-status"></div>
    <div class="panel live" id="live"></div>
    <p class="note" id="live-note"></p>
  </section>

  <div class="meta" id="meta"></div>
  <p class="plain" data-t="disclaimer"></p>

  <section>
    <h2 data-t="selection_title"></h2>
    <div class="panel" id="selection"></div>
    <p class="note" id="selection-note"></p>
  </section>

  <section>
    <h2 data-t="funnel_title"></h2>
    <div class="panel funnel" id="funnel"></div>
    <p class="note" data-t="funnel_note"></p>
  </section>

  <div class="grid2">
    <section>
      <h2 data-t="criteria_title"></h2>
      <ol class="panel criteria" id="criteria"></ol>
    </section>
    <section>
      <h2 data-t="history_title"></h2>
      <div class="panel" id="history"></div>
      <p class="note" data-t="history_note"></p>
    </section>
  </div>

  <section>
    <h2 data-t="sim_title"></h2>
    <div class="live-status" id="sim-status"></div>
    <div class="panel" id="sim"></div>
    <p class="note" id="sim-note"></p>
  </section>
</main>

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const domainLabel = d => d ? (TEXT.domains[d] || d) : TEXT.unclassified;
const pct = v => new Intl.NumberFormat(TEXT.locale, { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "always" }).format(v);
const signed = v => v > 0 ? "up" : v < 0 ? "down" : "";
const tone = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const usd = s => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(Number(s));
const musd = s => TEXT.millions(new Intl.NumberFormat(TEXT.locale, { maximumFractionDigits: 1 }).format(Number(s) / 1e6));
const nyTime = iso => new Date(iso).toLocaleTimeString(TEXT.locale, { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit" });

function table(columns, rows) {
  const t = el("table");
  const head = t.createTHead().insertRow();
  columns.forEach(c => head.appendChild(el("th", c.cls || "", c.label)));
  const body = t.createTBody();
  rows.forEach(row => {
    const tr = body.insertRow();
    columns.forEach(c => {
      const td = el("td", [c.cls, c.tone ? signed(c.tone(row)) : ""].filter(Boolean).join(" "), c.value(row));
      if (c.title) td.title = c.title(row);
      tr.appendChild(td);
    });
  });
  return t;
}

// Clôtures du dernier mois de tout l'univers, pour la séance affichée en direct ; null si absentes.
const CLOSES = window.CHART_CLOSES || null;
const chartCloses = symbol => {
  const values = CLOSES?.session_date === SHOWN?.session_date ? CLOSES.closes[symbol] : null;
  return values ? CLOSES.dates.map((d, i) => [d, values[i]]).filter(([, c]) => c !== null) : null;
};

// Graphique du dernier mois d'un titre : clôtures quotidiennes, puis prix du jour (en direct ou à la clôture).
const SVG_NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs, text) => {
  const node = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text !== undefined) node.textContent = text;
  return node;
};

function priceChart(item, closes, last, isFinal) {
  const W = 760, H = 250, L = 84, R = 150, T = 18, B = 30;
  const points = closes.map(([date, close]) => ({ date, price: Number(close) }));
  const prev = points[points.length - 1].price;
  const today = last ? Number(last.price) : null;
  const open = item.open_today === undefined ? null : Number(item.open_today);
  const values = [...points.map(p => p.price), ...(open === null ? [] : [open]), ...(today === null ? [] : [today])];
  const pad = (Math.max(...values) - Math.min(...values)) * 0.08 || 1;
  const lo = Math.min(...values) - pad, hi = Math.max(...values) + pad;
  // Le point du jour est placé un peu à l'écart des clôtures (2 crans) pour que les étiquettes respirent.
  const slots = points.length + 3;
  const x = i => L + (W - L - R) * i / (slots - 1);
  const y = v => T + (H - T - B) * (hi - v) / (hi - lo);

  const box = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img",
                           "aria-label": TEXT.chart_aria(item.symbol) });
  for (let g = 0; g <= 4; g++) {
    const v = lo + (hi - lo) * g / 4;
    box.append(svg("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid" }),
               svg("text", { x: L - 8, y: y(v) + 4, class: "axis", "text-anchor": "end" }, usd(v)));
  }
  const line = points.map((p, i) => `${x(i)},${y(p.price)}`).join(" ");
  box.append(svg("polygon", { points: `${x(0)},${y(lo)} ${line} ${x(points.length - 1)},${y(lo)}`, class: "area" }),
             svg("polyline", { points: line, class: "line" }));
  points.forEach((p, i) => {
    const dot = svg("circle", { cx: x(i), cy: y(p.price), r: 2.5, class: "point" });
    dot.append(svg("title", {}, `${p.date} : ${usd(p.price)}`));
    box.append(dot);
  });
  // Étiquette « ouverture » décalée si elle tomberait sur celle du prix du jour.
  const nowLabelY = today === null ? null : y(today) - 8;
  if (open !== null) {
    const openLabelY = nowLabelY !== null && Math.abs(nowLabelY - (y(open) + 4)) < 14
      ? nowLabelY + (y(open) > y(today) ? 16 : -16) : y(open) + 4;
    box.append(svg("line", { x1: x(points.length - 1), x2: x(slots - 1), y1: y(open), y2: y(open), class: "open" }),
               svg("text", { x: x(slots - 1) + 8, y: openLabelY, class: "axis" }, `${TEXT.chart_open} ${usd(open)}`));
  }
  // Variation du jour mesurée depuis le premier prix de la séance, comme la colonne « Depuis l'ouverture ».
  const sinceOpen = today !== null && open !== null ? today / open - 1 : null;
  if (today !== null) {
    box.append(svg("line", { x1: x(points.length - 1), y1: y(prev), x2: x(slots - 1), y2: y(today), class: "today" }));
    const dot = svg("circle", { cx: x(slots - 1), cy: y(today), r: 5,
                                class: "now " + (sinceOpen === null ? "flat" : tone(sinceOpen)) });
    dot.append(svg("title", {}, `${usd(today)} · ${nyTime(last.at)}`));
    box.append(dot, svg("text", { x: x(slots - 1) + 8, y: nowLabelY,
                                  class: "now-label " + (sinceOpen === null ? "" : signed(sinceOpen)) },
                        sinceOpen === null ? usd(today) : `${usd(today)} (${pct(sinceOpen)})`));
  }
  const mid = Math.floor((points.length - 1) / 2);
  [[0, points[0].date], [mid, points[mid].date], [points.length - 1, points[points.length - 1].date],
   [slots - 1, today === null ? TEXT.chart_today : (isFinal ? TEXT.chart_close : `${TEXT.chart_live} ${nyTime(last.at)}`)]]
    .forEach(([i, label]) => box.append(svg("text", { x: x(i), y: H - 8, class: "axis", "text-anchor": "middle" }, label)));

  const head = el("div", "chart-head");
  // 1 mois : même valeur que la colonne du tableau (figée au run pour la sélection, en direct sinon).
  const month = item.return_month ?? (today ?? prev) / points[0].price - 1;
  head.append(el("b", "", `${item.symbol} · ${item.name}`),
              el("span", signed(month), `${TEXT.chart_month} ${pct(month)}`));
  if (sinceOpen !== null) head.append(el("span", signed(sinceOpen), `${TEXT.chart_since_open} ${pct(sinceOpen)}`));
  const wrap = el("div", "chart-box");
  wrap.append(head, box);
  return wrap;
}

// Rend chaque symbole de la sélection cliquable ; le graphique ouvert s'affiche sous sa ligne.
function addCharts(tableEl, run, inSession) {
  const source = inSession ? LIVE : FINALS[run.session_date];
  const charts = source?.charts;
  const last = source?.selection?.changes || {};
  [...tableEl.tBodies[0].rows].forEach((tr, i) => {
    const item = run.selection[i];
    const closes = charts?.[item.symbol];
    if (!closes?.length) return;
    const key = `${run.run_id}:${item.symbol}`;
    const open = VIEW.chart === key;
    const button = el("button", "sector", (open ? "▾ " : "▸ ") + item.symbol);
    button.setAttribute("aria-expanded", String(open));
    button.title = TEXT.chart_hint;
    button.addEventListener("click", () => { saveView({ ...VIEW, chart: open ? null : key }); renderRun(run); });
    tr.cells[1].replaceChildren(button);
    if (open) {
      const row = el("tr", "chart-row");
      const td = el("td");
      td.colSpan = tr.cells.length;
      td.appendChild(priceChart(item, closes, last[item.symbol], !inSession));
      row.appendChild(td);
      tr.after(row);
    }
  });
}

function renderRun(run) {
  document.getElementById("status").textContent = `${run.status} · ${TEXT.not_judged}`;
  document.getElementById("meta").replaceChildren(...TEXT.meta(run).map(t => el("span", "", t)));

  const th = TEXT.th;
  // Variation depuis l'ouverture : en direct pendant la séance suivie, sinon l'état de fin de séance.
  const inSession = LIVE?.session_date === run.session_date && !LIVE.final ? LIVE.selection?.changes : null;
  const final = FINALS[run.session_date]?.selection?.changes;
  const live = inSession || final;
  const liveColumn = live && {
    label: inSession ? th.live : TEXT.open_to_close, value: r => live[r.symbol] ? pct(live[r.symbol].change) : "—",
    tone: r => live[r.symbol]?.change ?? 0,
    title: r => !live[r.symbol] ? TEXT.no_live_price
      : (inSession ? TEXT.live_cell : TEXT.final_cell)(usd(live[r.symbol].price), nyTime(live[r.symbol].at)),
  };
  const selectionTable = run.selection.length ? table([
    { label: th.rank, value: r => r.rank },
    { label: th.symbol, cls: "text symbol", value: r => r.symbol },
    { label: th.name, cls: "text name", value: r => r.name, title: r => r.name },
    { label: th.domain, cls: "text name", value: r => domainLabel(r.domain) + (r.domain_read_later ? " *" : ""),
      title: r => [r.sic_description, r.domain_read_later ? TEXT.read_later : ""].filter(Boolean).join(" · ") },
    { label: th.month, value: r => pct(r.return_month), tone: r => r.return_month },
    { label: th.d2, value: r => pct(r.return_day_minus_2), tone: r => r.return_day_minus_2 },
    { label: th.d1, value: r => pct(r.return_day_minus_1), tone: r => r.return_day_minus_1 },
    { label: th.first_hour, value: r => pct(r.return_first_hour), tone: r => r.return_first_hour },
    ...(run.criteria.max_pe ? [{ label: th.pe, value: r => r.pe_ttm == null ? "—" : Number(r.pe_ttm).toFixed(1) }] : []),
    ...(liveColumn ? [liveColumn] : []),
    { label: th.price, value: r => usd(r.price_at_decision) },
    { label: th.vol, value: r => new Intl.NumberFormat(TEXT.locale, { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(r.volatility_annualized) },
    { label: th.volume, value: r => musd(r.avg_dollar_volume) },
  ], run.selection) : null;
  if (selectionTable) addCharts(selectionTable, run, inSession);
  document.getElementById("selection").replaceChildren(selectionTable || el("div", "empty", TEXT.no_selection));
  document.getElementById("selection-note").textContent =
    (run.selection.length < run.criteria.count ? TEXT.fewer(run.selection.length, run.criteria.count) : TEXT.ranked)
    + TEXT.domain_note + (run.selection.some(r => r.domain_read_later) ? TEXT.star_note : "")
    + (inSession ? TEXT.live_col_note : final ? TEXT.final_col_note : "");

  renderBubbles(run);

  const steps = Object.entries(run.funnel);
  document.getElementById("funnel").replaceChildren(...steps.map(([key, n], i) => {
    const step = el("div", "step" + (i === steps.length - 1 ? " last" : ""));
    step.append(el("b", "", n.toLocaleString(TEXT.locale)), el("span", "", TEXT.steps[key] || key));
    return step;
  }));

  document.getElementById("criteria").replaceChildren(...TEXT.criteria(run.criteria).map(t => el("li", "", t)));
}

function renderBubbles(run) {
  const box = document.getElementById("bubbles");
  const note = document.getElementById("bubbles-note");
  const domains = run.domains;
  if (!domains || domains.error) {
    box.replaceChildren(el("div", "empty", domains ? TEXT.bubbles_error(domains.error) : TEXT.bubbles_missing));
    note.textContent = "";
    return;
  }
  const picked = new Map();
  run.selection.forEach(item => picked.set(item.domain, (picked.get(item.domain) || 0) + 1));
  const maxN = Math.max(...domains.bubbles.map(b => b.n));
  box.replaceChildren(...domains.bubbles.map(b => {
    const bubble = el("div", "bubble " + tone(b.mean_return));
    bubble.style.width = Math.round(120 + 120 * Math.sqrt(b.n / maxN)) + "px";
    bubble.title = TEXT.bubble_title(domainLabel(b.domain), b.n);
    bubble.append(el("span", "domain", domainLabel(b.domain)), el("span", "mean", pct(b.mean_return)),
                  el("span", "count", TEXT.n_stocks(b.n) + (picked.get(b.domain) ? TEXT.picked(picked.get(b.domain)) : "")));
    return bubble;
  }));
  note.textContent = TEXT.bubbles_note(run.criteria.month_sessions, domains.unclassified);
}

// Domaine ouvert et tri choisis : gardés pour la session de l'onglet, pour survivre au rechargement
// automatique de la page (en mémoire seulement si le navigateur refuse le stockage).
const VIEW_KEY = "alpaca_live_view";
let VIEW = (() => { try { return JSON.parse(sessionStorage.getItem(VIEW_KEY)) || {}; } catch { return {}; } })();
function saveView(view) {
  VIEW = view;
  try { sessionStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch { /* mémoire seulement */ }
}

// Liste des titres d'un domaine, classée du meilleur au moins bon sur la colonne choisie (Journée par défaut).
function sectorTable(list, measures, picked) {
  // Colonnes : les 5 variations (en %), puis les deux comptages sur l'historique (en nombre de fois).
  const columns = [
    ...measures.map(([k, label, how]) => [k, label, how, "pct"]),
    ["in_selection", TEXT.col_in_selection, TEXT.how_in_selection(HISTORY.runs), "count"],
    ["top_in_domain", TEXT.col_top_domain(HISTORY.top_n), TEXT.how_top_domain(HISTORY.top_n, HISTORY.finals), "count"],
  ];
  const rows = list.map(st => ({ ...st, in_selection: HISTORY.in_selection[VARIANT]?.[st.symbol] || 0,
                                 top_in_domain: HISTORY.top_in_domain[st.symbol] || 0 }));
  const key = VIEW.sortKey || "day";
  const dir = VIEW.sortDir || "desc";
  const sorted = rows.sort((a, b) => {
    if (a[key] == null || b[key] == null) return (a[key] == null) - (b[key] == null) || a.symbol.localeCompare(b.symbol);
    return dir === "desc" ? b[key] - a[key] : a[key] - b[key];
  });
  const t = el("table", "stocks");
  const head = t.createTHead().insertRow();
  head.append(el("th", "", TEXT.th.rank), el("th", "text", TEXT.th.symbol), el("th", "text", TEXT.th.name));
  columns.forEach(([k, label, how]) => {
    const th = el("th", "sortable", label + (k === key ? (dir === "desc" ? " ▾" : " ▴") : ""));
    th.title = `${how} · ${TEXT.sort_hint}`;
    th.tabIndex = 0;
    th.setAttribute("role", "button");
    const sort = () => { saveView({ ...VIEW, sortKey: k, sortDir: k === key && dir === "desc" ? "asc" : "desc" }); renderLive(); };
    th.addEventListener("click", sort);
    th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(); } });
    head.appendChild(th);
  });
  const body = t.createTBody();
  sorted.forEach((st, i) => {
    const tr = body.insertRow();
    tr.appendChild(el("td", "", i + 1));
    const label = st.symbol + (picked.has(st.symbol) ? " ★" : "");
    const closes = chartCloses(st.symbol);
    const chartOpen = closes !== null && VIEW.stockChart === st.symbol;
    const symbol = el("td", "text symbol");
    if (closes) {
      const button = el("button", "sector", (chartOpen ? "▾ " : "▸ ") + label);
      button.setAttribute("aria-expanded", String(chartOpen));
      button.title = TEXT.chart_hint + (picked.has(st.symbol) ? ` · ${TEXT.in_selection}` : "");
      button.addEventListener("click", () => { saveView({ ...VIEW, stockChart: chartOpen ? null : st.symbol }); renderLive(); });
      symbol.appendChild(button);
    } else {
      symbol.append(label);
      if (picked.has(st.symbol)) symbol.title = TEXT.in_selection;
    }
    const name = el("td", "text name", st.name);
    name.title = st.name;
    tr.append(symbol, name);
    columns.forEach(([k, , , type]) => tr.appendChild(type === "count"
      ? el("td", "", st[k])
      : el("td", st[k] == null ? "" : signed(st[k]), st[k] == null ? "—" : pct(st[k]))));
    if (chartOpen) {
      const row = body.insertRow();
      row.className = "chart-row";
      const td = el("td");
      td.colSpan = columns.length + 3;
      td.appendChild(priceChart({ symbol: st.symbol, name: st.name, open_today: st.open ?? undefined }, closes,
                                st.price == null ? null : { price: st.price, at: SHOWN.prices_until }, !!SHOWN.final));
      row.appendChild(td);
    }
  });
  return t;
}

function renderLive() {
  const status = document.getElementById("live-status");
  const box = document.getElementById("live");
  if (!SHOWN) {
    status.replaceChildren(el("span", "pulse off"), el("span", "", TEXT.live_off));
    box.replaceChildren(el("div", "empty", TEXT.live_launch));
    renderSim();
    return;
  }
  const running = !SHOWN.final && Date.now() - new Date(SHOWN.observed_at).getTime() < LIVE_STALE_MS;
  status.replaceChildren(...(SHOWN.final ? [
    el("span", "pulse off"),
    el("span", "", TEXT.final_state(SHOWN.session_date)),
    el("span", "", SHOWN.provisional ? TEXT.final_provisional : TEXT.final_definitive),
    el("span", "", TEXT.final_source),
  ] : [
    el("span", "pulse" + (running ? "" : " off")),
    el("span", "", running ? TEXT.live_running : TEXT.live_stopped(SHOWN.session_date)),
    el("span", "", SHOWN.prices_until ? TEXT.prices_until(nyTime(SHOWN.prices_until)) : TEXT.no_prices),
    el("span", "", TEXT.updated_at(nyTime(SHOWN.observed_at))),
    el("span", "", TEXT.feed),
  ]));

  const s = SHOWN.sessions;
  const columns = [
    ["day", TEXT.col_day, TEXT.how_day],
    ["first_hour", TEXT.col_first_hour(SHOWN.first_hour_minutes), TEXT.how_first_hour],
    ["two_days", TEXT.col_sessions(s.two_days), TEXT.how_sessions(s.two_days)],
    ["week", TEXT.col_week, TEXT.how_sessions(s.week)],
    ["month", TEXT.col_month, TEXT.how_sessions(s.month)],
  ];
  const cells = Object.fromEntries(columns.map(([key]) =>
    [key, new Map(SHOWN.measures[key].bubbles.map(b => [b.domain, b]))]));
  const order = [...new Set(columns.flatMap(([key]) => SHOWN.measures[key].bubbles.map(b => b.domain)))];
  order.sort((a, b) => (cells.day.get(b)?.mean_return ?? -Infinity) - (cells.day.get(a)?.mean_return ?? -Infinity));

  // Titres de l'univers regroupés par domaine ("" = sans domaine connu de la SEC).
  const stocks = SHOWN.stocks
    ? SHOWN.stocks.rows.map(row => Object.fromEntries(SHOWN.stocks.columns.map((c, i) => [c, row[i]]))) : [];
  const bySector = new Map();
  stocks.forEach(st => {
    const key = st.domain ?? "";
    if (!bySector.has(key)) bySector.set(key, []);
    bySector.get(key).push(st);
  });
  if (bySector.has("")) order.push("");
  const picked = new Set((runFor(SHOWN.session_date)?.selection || []).map(i => i.symbol));

  const t = el("table");
  const head = t.createTHead().insertRow();
  head.appendChild(el("th", "text", TEXT.col_domain));
  columns.forEach(([, label, how]) => { const th = el("th", "", label); th.title = how; head.appendChild(th); });
  const body = t.createTBody();
  order.forEach(domain => {
    const list = bySector.get(domain) || [];
    const open = list.length > 0 && VIEW.sector === domain;
    const tr = body.insertRow();
    const name = el("td", "text");
    const label = domainLabel(domain || null);
    if (list.length) {
      const toggle = el("button", "sector", (open ? "▾ " : "▸ ") + label);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.title = TEXT.sector_hint;
      toggle.addEventListener("click", () => { saveView({ ...VIEW, sector: open ? null : domain }); renderLive(); });
      name.appendChild(toggle);
    } else {
      name.append(label);
    }
    const n = list.length || cells.day.get(domain)?.n || cells.month.get(domain)?.n;
    if (n) name.appendChild(el("small", "", TEXT.n_stocks(n)));
    tr.appendChild(name);
    columns.forEach(([key, label]) => {
      const td = el("td");
      const b = cells[key].get(domain);
      const dot = b ? el("span", "dot " + tone(b.mean_return), pct(b.mean_return))
                    : el("span", "dot none", SHOWN.measures[key].available ? "—" : TEXT.upcoming);
      if (b) dot.title = TEXT.dot_title(domainLabel(domain), label, b.n);
      td.appendChild(dot);
      tr.appendChild(td);
    });
    if (open) {
      const detail = body.insertRow();
      detail.className = "detail";
      const td = el("td");
      td.colSpan = columns.length + 1;
      td.appendChild(sectorTable(list, columns, picked));
      detail.appendChild(td);
    }
  });
  box.replaceChildren(order.length ? t : el("div", "empty", TEXT.no_session_prices));
  document.getElementById("live-note").textContent = TEXT.live_note(SHOWN.universe, SHOWN.first_hour_minutes);
  renderSim();
}

// Simulation : montant réparti à parts égales sur chaque liste, achat après la première heure, vente 30 min avant la clôture.
function renderSim() {
  const status = document.getElementById("sim-status");
  const box = document.getElementById("sim");
  const note = document.getElementById("sim-note");
  const sim = SHOWN?.portfolio;
  if (!sim || !Object.keys(sim.versions).length) {
    status.replaceChildren();
    box.replaceChildren(el("div", "empty", SHOWN?.portfolio ? TEXT.sim_no_list : TEXT.sim_missing));
    note.textContent = "";
    return;
  }
  const versions = VARIANTS.filter(v => sim.versions[v]);
  const states = versions.map(v => sim.versions[v].status);
  const label = states.every(s => s === "closed") ? TEXT.sim_closed(nyTime(sim.exit_time))
    : states.includes("live") ? TEXT.sim_live(SHOWN.prices_until ? nyTime(SHOWN.prices_until) : "—")
    : TEXT.sim_waiting(nyTime(sim.entry_time));
  status.replaceChildren(el("span", "pulse" + (states.includes("live") && !SHOWN.final ? "" : " off")), el("span", "", label),
                         el("span", "", TEXT.sim_times(nyTime(sim.entry_time), nyTime(sim.exit_time))));

  const amounts = ["10000", "25000", "50000", "100000", "1000000"];
  const t = el("table");
  const head = t.createTHead().insertRow();
  head.appendChild(el("th", "text", TEXT.sim_amount));
  versions.forEach(v => {
    const r = sim.versions[v];
    head.appendChild(el("th", "", `${TEXT.variants[v]} · ${TEXT.n_stocks(r.priced || r.n)}`));
  });
  const body = t.createTBody();
  amounts.forEach(amount => {
    const tr = body.insertRow();
    tr.appendChild(el("td", "text", usd(amount)));
    versions.forEach(v => {
      const r = sim.versions[v];
      const gain = r.gains[amount];
      tr.appendChild(gain === undefined ? el("td", "", "—")
        : el("td", signed(Number(gain)), `${Number(gain) >= 0 ? "+" : ""}${usd(gain)} (${pct(r.mean_return)})`));
    });
  });
  box.replaceChildren(t);
  note.textContent = TEXT.sim_note;
}

function renderHistory() {
  const seen = new Map();
  // Une liste par séance : la plus récente (un run recalculé remplace l'ancien pour le comptage).
  const latest = [...new Set(RUNS.map(run => run.session_date))].map(date => runFor(date)).filter(Boolean);
  latest.forEach(run => run.selection.forEach(item => {
    const entry = seen.get(item.symbol) || { symbol: item.symbol, name: item.name, count: 0, last: "" };
    entry.count += 1;
    entry.last = run.session_date;
    seen.set(item.symbol, entry);
  }));
  const rows = [...seen.values()].sort((a, b) => b.count - a.count || a.symbol.localeCompare(b.symbol)).slice(0, 25);
  const th = TEXT.th;
  document.getElementById("history").replaceChildren(rows.length ? table([
    { label: th.symbol, cls: "text symbol", value: r => r.symbol },
    { label: th.name, cls: "text name", value: r => r.name, title: r => r.name },
    { label: th.times, value: r => r.count },
    { label: th.last, value: r => r.last },
  ], rows) : el("div", "empty", TEXT.no_history));
}

document.title = TEXT.title;
document.querySelectorAll("[data-t]").forEach(node => { node.textContent = TEXT[node.dataset.t]; });
const other = document.getElementById("other-lang");
other.textContent = TEXT.other;
other.href = TEXT.other_href;

const picker = document.getElementById("run");
// Deux versions de la liste chaque séance : critères d'origine, et critères + PER < 12.
const VARIANTS = ["per12", "sans_per"];
const variantOf = run => run.variant || (run.criteria.max_pe ? "per12" : "sans_per");
let VARIANT = VARIANTS.includes(VIEW.variant) ? VIEW.variant : VARIANTS[0];
// Liste la plus récente d'une séance pour une version (celle choisie par défaut).
const runFor = (date, variant = VARIANT) => RUNS.findLast(r => r.session_date === date && variantOf(r) === variant);
const variantPicker = document.getElementById("variant");
VARIANTS.forEach(v => variantPicker.add(new Option(TEXT.variants[v], v)));
variantPicker.value = VARIANT;
variantPicker.addEventListener("change", () => {
  VARIANT = variantPicker.value;
  saveView({ ...VIEW, variant: VARIANT });
  renderSession(picker.value);
  renderHistory();
});
const SESSION_DATES = [...new Set([...Object.keys(FINALS), ...RUNS.map(r => r.session_date),
                                   ...(LIVE ? [LIVE.session_date] : [])])].sort().reverse();
window.SESSION_STATES = window.SESSION_STATES || {};

// État d'une séance : en direct (embarqué), ou figé, chargé à la demande depuis sessions/<date>.js.
function withState(date, then) {
  if (LIVE?.session_date === date) return then(LIVE);
  if (window.SESSION_STATES[date] || !FINALS[date]) return then(window.SESSION_STATES[date] || null);
  const script = document.createElement("script");
  script.src = `sessions/${date}.js`;
  script.onload = () => then(window.SESSION_STATES[date] || null);
  script.onerror = () => then(null);
  document.head.appendChild(script);
}

function renderNoRun(date, message) {
  document.getElementById("status").textContent = `diagnostic · ${TEXT.not_judged}`;
  document.getElementById("meta").replaceChildren(el("span", "", TEXT.session_of(date)));
  document.getElementById("selection").replaceChildren(el("div", "empty", message));
  document.getElementById("selection-note").textContent = "";
  ["bubbles", "funnel", "criteria"].forEach(id => document.getElementById(id).replaceChildren());
  document.getElementById("bubbles-note").textContent = "";
}

function renderSession(date) {
  withState(date, state => {
    SHOWN = state;
    renderLive();
    const run = runFor(date);
    if (run) renderRun(run);
    else renderNoRun(date, RUNS.some(r => r.session_date === date) ? TEXT.no_run_variant(TEXT.variants[VARIANT]) : TEXT.no_run_yet);
  });
}

if (!SESSION_DATES.length) {
  document.getElementById("selection").replaceChildren(el("div", "empty", TEXT.no_runs));
  picker.disabled = true;
  renderLive();
} else {
  SESSION_DATES.forEach(date => {
    const runs = VARIANTS.map(v => runFor(date, v)).filter(Boolean);
    const live = LIVE?.session_date === date && !LIVE.final;
    const tag = live ? TEXT.opt_live : FINALS[date] ? (FINALS[date].provisional ? TEXT.opt_provisional : TEXT.opt_final) : "";
    picker.add(new Option([date, tag, runs.map(r => r.run_id).join(" + ")].filter(Boolean).join(" · "), date));
  });
  // La séance choisie est gardée dans l'adresse (#2026-10-14) pour survivre au rechargement automatique.
  const fromHash = location.hash.slice(1);
  const legacy = RUNS.find(r => r.run_id === fromHash)?.session_date;
  const chosen = SESSION_DATES.includes(fromHash) ? fromHash : legacy || SESSION_DATES[0];
  picker.value = chosen;
  picker.addEventListener("change", () => { location.hash = picker.value; renderSession(picker.value); });
  renderSession(chosen);
}
renderHistory();
</script>
