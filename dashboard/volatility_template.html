<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Régénérée à chaque passage du suivi en direct (dashboard/volatility.py) : elle se recharge seule. -->
<meta http-equiv="refresh" content="60">
<title>Volatilité</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #17202b; --muted: #5d6877; --line: #dde1e7;
    --accent: #2b5d8c; --up: #1d7a4c; --down: #b23a3a; --track: #e7eaef;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
      --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; --track: #24303c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
    --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; --track: #24303c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
  h1 { margin: 0; font-size: 26px; flex: 1 1 auto; }
  h2 { margin: 8px 0 0; font-size: 20px; }
  header a { color: var(--accent); font-weight: 600; }
  .intro { margin: 0; max-width: 85ch; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  .round { padding: 18px 20px; display: grid; gap: 14px; }
  .status { font-weight: 700; color: var(--accent); }
  .status.sold { color: var(--up); }
  .figures { display: flex; flex-wrap: wrap; gap: 12px 36px; }
  .figure .label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .figure .value { font-family: var(--font-data); font-size: 22px; }
  .bar { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--up); }
  .bar span.neg { background: var(--down); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  th.text, td.text { text-align: left; }
  td.num { font-family: var(--font-data); white-space: nowrap; }
  td .desc { color: var(--muted); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .up { color: var(--up); } .down { color: var(--down); }
  .progress { display: grid; gap: 3px; min-width: 120px; }
  .progress .bar { height: 6px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; max-width: 100ch; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <a id="home"></a>
    <a id="other"></a>
  </header>
  <p class="intro" id="intro"></p>
  <p class="note" id="updated"></p>
  <div class="panel round" id="summary"></div>
  <h2 id="batches-title"></h2>
  <div class="panel"><table id="batches"></table></div>
  <h2 id="open-title"></h2>
  <div class="panel"><table id="open"></table></div>
  <h2 id="sold-title"></h2>
  <div class="panel"><table id="sold"></table></div>
  <p class="note" id="note"></p>
</main>
<script>
const LANG = "__LANG__";
const STATE = __STATE_JSON__;
const TEXT = {
  fr: {
    title: "Volatilité", home: "← Mes stratégies", home_href: "accueil.html", other: "English", other_href: "volatility_en.html", locale: "fr-FR",
    intro: (a, t, k) => `But : investir ${a} dans chaque action et gagner ${t} sur chacune, si possible dans la journée. La liste « Volatilité » a été faite le 21 octobre : ${k} actions cotées au Nasdaq par domaine (hors crypto et ETF), très échangées, très volatiles, en tendance neutre ou positive sur 6 mois et les moins liées entre elles. Chaque jour, à l'ouverture de New York (15 h 30 à Paris), une nouvelle vague achète de zéro chaque action de cette même liste pour ${a}, même celles qu'une vague précédente détient encore. Dans chaque vague, chaque action est gardée seule jusqu'à ce que son gain net de frais atteigne ${t} — en 1 heure ou en 3 jours — puis vendue. Rien ne se vend la nuit : un objectif atteint pendant la fermeture est vendu à la première minute de l'ouverture. Les vagues tournent côte à côte jusqu'à ce que toutes leurs actions aient atteint l'objectif.`,
    updated: t => `Mise à jour à ${t} (Paris) — prix avec 15 minutes de retard ; la page se recharge toute seule.`,
    f_held: "Actions détenues", f_invested: "Montant investi", f_open_gain: "Gain net en cours", f_sold: "Actions vendues à l'objectif", f_banked: "Gains encaissés", f_mean: "Temps moyen pour l'objectif",
    next_open: d => `Prochaine vague à l'ouverture du ${d} (15 h 30 à Paris), même liste.`,
    batches_title: "Vagues (une par jour)",
    batches_head: ["Vague (achat)", "Objectif atteint", "Encore détenues", "Gains encaissés", "Gain net en cours", "Plus rapide", "Plus lente (vendue)"],
    open_title: "Actions détenues",
    open_head: ["Action", "Domaine", "Achetée", "Prix d'achat", "Dernier", "Variation", "Gain net", "Vers l'objectif", "Détenue depuis", "Règle relâchée"],
    none_open: "Aucune action détenue.",
    sold_title: "Actions vendues à l'objectif",
    sold_head: ["Action", "Achetée", "Vendue", "Temps pour l'objectif", "Dont marché ouvert", "Séances", "Gain net"],
    none_sold: "Aucune action n'a encore atteint l'objectif.",
    steps: { strict: "—", volatilite_top_35: "volatilité (top 35 %)", volume_20M: "montant (20 M$)", volatilite_top_50: "volatilité (top 50 %)", "tendance_-10": "tendance (−10 %)", volume_10M: "montant (10 M$)" },
    day: "j", days: "j",
    note: c => `Simulation en papier : aucun ordre n'est passé. Frais comptés : ${c} % par ordre (achat et vente), donc chaque action doit monter d'environ 4,1 % pour rapporter 200 $ nets. Le prix d'achat est le premier échange de l'action à l'ouverture ; la vente se fait au cours de la minute où l'objectif est atteint (contrôle à chaque minute de séance, jamais la nuit : un saut à l'ouverture est vendu à la première minute). Pas de stop : une action qui baisse est gardée. « Règle relâchée » : un domaine qui n'avait pas 5 actions remplissant toutes les règles est complété au plus proche.`,
  },
  en: {
    title: "Volatility", home: "← My strategies", home_href: "home.html", other: "Français", other_href: "volatilite.html", locale: "en-US",
    intro: (a, t, k) => `Goal: invest ${a} in each stock and make ${t} on each one, ideally within the day. The "Volatility" list was made on October 21: ${k} Nasdaq-listed stocks per domain (no crypto, no ETFs), heavily traded, extremely volatile, with a neutral or positive 6-month trend, and the least tied to each other. Every day at the New York open (15:30 in Paris), a new batch buys every stock on that same list from zero for ${a}, even those an earlier batch still holds. In each batch, each stock is held on its own until its net gain after costs reaches ${t} — whether in 1 hour or 3 days — then sold. Nothing is sold overnight: a target reached while the market is closed is sold in the first minute after the open. Batches run side by side until all their stocks have reached the target.`,
    updated: t => `Updated at ${t} (Paris) — prices 15 minutes late; the page reloads itself.`,
    f_held: "Stocks held", f_invested: "Amount invested", f_open_gain: "Current net gain", f_sold: "Stocks sold at target", f_banked: "Gains banked", f_mean: "Average time to target",
    next_open: d => `Next batch at the open on ${d} (15:30 in Paris), same list.`,
    batches_title: "Batches (one per day)",
    batches_head: ["Batch (bought)", "Target reached", "Still held", "Gains banked", "Current net gain", "Fastest", "Slowest (sold)"],
    open_title: "Stocks held",
    open_head: ["Stock", "Domain", "Bought", "Buy price", "Last", "Change", "Net gain", "Towards target", "Held for", "Loosened rule"],
    none_open: "No stock held.",
    sold_title: "Stocks sold at target",
    sold_head: ["Stock", "Bought", "Sold", "Time to target", "Of which market open", "Sessions", "Net gain"],
    none_sold: "No stock has reached the target yet.",
    steps: { strict: "—", volatilite_top_35: "volatility (top 35%)", volume_20M: "traded value ($20M)", volatilite_top_50: "volatility (top 50%)", "tendance_-10": "trend (−10%)", volume_10M: "traded value ($10M)" },
    day: "day", days: "days",
    note: c => `Paper simulation: no order is placed. Costs counted: ${c}% per order (buy and sell), so each stock must rise about 4.1% to make $200 net. The purchase price is the stock's first trade at the open; the sale happens at the price of the minute the target is reached (checked every session minute, never overnight: a jump at the open is sold at the first minute). No stop: a falling stock is kept. "Loosened rule": a domain that didn't have 5 stocks meeting every rule is filled with the closest fits.`,
  },
}[LANG];
const usd = (v, sign) => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", signDisplay: sign ? "exceptZero" : "auto" }).format(v);
const whole = v => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v);
const pct = v => new Intl.NumberFormat(TEXT.locale, { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "exceptZero" }).format(v);
const clock = (iso, tz) => new Date(iso).toLocaleTimeString(TEXT.locale, { timeZone: tz, hour: "2-digit", minute: "2-digit" });
const dayOf = iso => new Date(iso).toLocaleDateString(TEXT.locale, { timeZone: "America/New_York", day: "numeric", month: "short" });
const when = iso => `${dayOf(iso)} · ${clock(iso, "America/New_York")} NY · ${clock(iso, "Europe/Paris")} Paris`;
const span = s => {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.round(s % 3600 / 60);
  return [d ? `${d} ${d > 1 ? TEXT.days : TEXT.day}` : "", h ? `${h} h` : "", `${m} min`].filter(Boolean).join(" ");
};
const signClass = v => v > 0 ? "up" : v < 0 ? "down" : "";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const header = (table, labels, textCols) => { const r = table.createTHead().insertRow(); labels.forEach((h, i) => r.append(el("th", textCols.includes(i) ? "text" : "", h))); };
const empty = (body, text, n) => { const td = el("td", "text", text); td.colSpan = n; body.insertRow().append(td); };

document.documentElement.lang = LANG;
document.title = TEXT.title;
document.getElementById("title").textContent = TEXT.title;
Object.assign(document.getElementById("home"), { textContent: TEXT.home, href: TEXT.home_href });
Object.assign(document.getElementById("other"), { textContent: TEXT.other, href: TEXT.other_href });
const target = +STATE.target_gain, each = +STATE.amount_per_stock;
document.getElementById("intro").textContent = TEXT.intro(whole(each), whole(target), STATE.per_domain);
document.getElementById("updated").textContent = TEXT.updated(clock(STATE.updated, "Europe/Paris"));
document.getElementById("note").textContent = TEXT.note((+STATE.cost_bps / 100).toLocaleString(TEXT.locale));

const openGain = STATE.open.reduce((t, p) => t + (p.gain == null ? 0 : +p.gain), 0);
const banked = STATE.sold.reduce((t, p) => t + +p.sold_gain, 0);
const mean = STATE.sold.length ? STATE.sold.reduce((t, p) => t + p.elapsed_seconds, 0) / STATE.sold.length : null;
const box = document.getElementById("summary"), figs = el("div", "figures");
[[TEXT.f_held, STATE.open.length], [TEXT.f_invested, whole(STATE.open.length * each)],
 [TEXT.f_open_gain, usd(openGain, true), signClass(openGain)], [TEXT.f_sold, STATE.sold.length],
 [TEXT.f_banked, usd(banked, true), signClass(banked)], [TEXT.f_mean, mean == null ? "—" : span(mean)]]
  .forEach(([label, value, cls]) => { const f = el("div", "figure"); f.append(el("div", "label", label), el("div", "value " + (cls || ""), value)); figs.append(f); });
box.append(figs);
if (STATE.next_open) box.append(el("div", "note", TEXT.next_open(dayOf(STATE.next_open))));

document.getElementById("batches-title").textContent = TEXT.batches_title;
const bt = document.getElementById("batches");
header(bt, TEXT.batches_head, [0]);
const bb = bt.createTBody();
const batches = {};
[...STATE.open, ...STATE.sold].forEach(p => (batches[p.entry_time] ??= { open: [], sold: [] })[p.status === "sold" ? "sold" : "open"].push(p));
Object.entries(batches).sort((a, b) => b[0].localeCompare(a[0])).forEach(([at, g]) => {
  const tr = bb.insertRow(), n = g.open.length + g.sold.length;
  const times = g.sold.map(p => p.elapsed_seconds);
  const bank = g.sold.reduce((t, p) => t + +p.sold_gain, 0), live = g.open.reduce((t, p) => t + (p.gain == null ? 0 : +p.gain), 0);
  tr.append(el("td", "text", `${dayOf(at)} · ${clock(at, "America/New_York")} NY`));
  tr.append(el("td", "num", `${g.sold.length} / ${n}`), el("td", "num", g.open.length));
  tr.append(el("td", "num " + signClass(bank), usd(bank, true)), el("td", "num " + signClass(live), usd(live, true)));
  tr.append(el("td", "num", times.length ? span(Math.min(...times)) : "—"), el("td", "num", times.length ? span(Math.max(...times)) : "—"));
});

document.getElementById("open-title").textContent = TEXT.open_title;
const ot = document.getElementById("open");
header(ot, TEXT.open_head, [0, 1, 2, 9]);
const ob = ot.createTBody();
if (!STATE.open.length) empty(ob, TEXT.none_open, TEXT.open_head.length);
STATE.open.slice().sort((a, b) => (b.gain == null ? -1e9 : +b.gain) - (a.gain == null ? -1e9 : +a.gain)).forEach(p => {
  const tr = ob.insertRow(), gain = p.gain == null ? null : +p.gain;
  const name = el("td", "text"); name.append(el("b", null, p.symbol), el("div", "desc", p.name.split(" - ")[0])); tr.append(name);
  tr.append(el("td", "text", p.domain), el("td", "text", `${dayOf(p.entry_time)} · ${clock(p.entry_time, "America/New_York")} NY`));
  tr.append(el("td", "num", p.entry == null ? "—" : usd(+p.entry)), el("td", "num", p.last == null ? "—" : usd(+p.last)));
  tr.append(el("td", "num " + signClass(p.return), p.return == null ? "—" : pct(p.return)));
  tr.append(el("td", "num " + signClass(gain), gain == null ? "—" : usd(gain, true)));
  const prog = el("td"), wrap = el("div", "progress"), bar = el("div", "bar"), fill = el("span", gain < 0 ? "neg" : "");
  fill.style.width = `${Math.max(0, Math.min(100, Math.abs(gain || 0) / target * 100))}%`; bar.append(fill);
  wrap.append(bar, el("div", "desc", gain == null ? "—" : `${Math.round(gain / target * 100)} %`)); prog.append(wrap); tr.append(prog);
  tr.append(el("td", "num", span(p.elapsed_seconds)), el("td", "text", TEXT.steps[p.step] ?? p.step));
});

document.getElementById("sold-title").textContent = TEXT.sold_title;
const st = document.getElementById("sold");
header(st, TEXT.sold_head, [0, 1, 2]);
const sb = st.createTBody();
if (!STATE.sold.length) empty(sb, TEXT.none_sold, TEXT.sold_head.length);
STATE.sold.slice().sort((a, b) => b.sold_at.localeCompare(a.sold_at)).forEach(p => {
  const tr = sb.insertRow();
  const name = el("td", "text"); name.append(el("b", null, p.symbol), el("div", "desc", p.domain)); tr.append(name);
  tr.append(el("td", "text", when(p.entry_time)), el("td", "text", when(p.sold_at)));
  tr.append(el("td", "num", span(p.elapsed_seconds)), el("td", "num", span(p.market_seconds)), el("td", "num", p.sessions_held));
  tr.append(el("td", "num " + signClass(+p.sold_gain), usd(+p.sold_gain, true)));
});
</script>
</body>
</html>
