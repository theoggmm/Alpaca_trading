<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Régénérée chaque minute par le suivi en direct, comme les tableaux de bord : elle se recharge seule. -->
<meta http-equiv="refresh" content="60">
<title>Stratégies</title>
<!-- Généré par dashboard/build.py : une ligne par stratégie de la famille. -->
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #17202b; --muted: #5d6877; --line: #dde1e7;
    --accent: #2b5d8c; --up: #1d7a4c; --down: #b23a3a;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
      --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --surface: #171e26; --ink: #e6ebf1; --muted: #93a0b0; --line: #2a3542;
    --accent: #7fb0de; --up: #4cc38a; --down: #f07a7a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
  main { max-width: 1440px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
  h1 { margin: 0; font-size: 26px; flex: 1 1 auto; }
  header a { color: var(--accent); font-weight: 600; }
  .intro { margin: 0; max-width: 85ch; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  th.text, td.text { text-align: left; }
  td.num { font-family: var(--font-data); white-space: nowrap; }
  td a { color: var(--accent); font-weight: 700; text-decoration: none; }
  td .desc { color: var(--muted); font-size: 13px; max-width: 34ch; }
  /* Mise en page d'origine : la colonne des stratégies garde sa largeur ; une situation (pas encore de chiffre)
     s'affiche en petit, en gris, et peut passer à la ligne. */
  td.text:first-child { min-width: 220px; }
  th:not(.text) { min-width: 82px; }
  /* Colonnes « sans stop/objectif » : fond légèrement grisé, pour les distinguer d'un coup d'œil. */
  th.alt, td.alt { background: color-mix(in srgb, var(--line) 35%, transparent); }
  td.state { font-family: var(--font-ui); font-size: 12px; color: var(--muted); white-space: normal; min-width: 70px; }
  tr:last-child td { border-bottom: none; }
  .up { color: var(--up); } .down { color: var(--down); }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .override-banner { margin: 0; padding: 10px 14px; border: 1px solid var(--down); border-left: 5px solid var(--down);
                     border-radius: 6px; color: var(--down); font-weight: 600; }
  td .flag { color: var(--down); font-weight: 700; }
  .best { display: grid; gap: 12px; }
  .best h2 { margin: 12px 0 0; font-size: 20px; }
  .best h3 { margin: 8px 0 0; font-size: 15px; }
  .sel-today { padding: 14px 16px; display: grid; gap: 6px; }
  .sel-today .pick b { color: var(--accent); }
  .pickers { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .pickers select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  #best-table td.text { min-width: 0; }
  .vol { display: grid; gap: 8px; }
  .vol h2 { margin: 4px 0 0; font-size: 20px; }
  .vol h2 a { color: var(--accent); text-decoration: none; }
  #vol-table td.text { min-width: 0; }
  #best-table tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <a id="rule-link"></a>
    <a id="vol-link"></a>
    <a id="other"></a>
  </header>
  <p class="intro" id="intro"></p>
  <p class="override-banner" id="override-warn" hidden></p>
  <p class="note" id="updated"></p>
  <section class="vol" id="vol" hidden>
    <h2 id="vol-title"></h2>
    <p class="note" id="vol-intro"></p>
    <div class="panel"><table id="vol-table"></table></div>
  </section>
  <div class="panel"><table id="rows"></table></div>
  <p class="note" id="note"></p>

  <section class="best">
    <h2 id="best-title"></h2>
    <p class="intro" id="best-intro"></p>
    <div class="pickers">
      <label><span id="best-year-label"></span> <select id="best-year"></select></label>
      <label><span id="best-amount-label"></span> <select id="best-amount"></select></label>
      <label><span id="best-selection-label"></span> <select id="best-selection"></select></label>
    </div>
    <div class="panel"><table id="best-table"></table></div>
    <p class="note" id="best-note"></p>
  </section>
</main>
<script>
const LANG = "__LANG__";
const ROWS = __ROWS_JSON__;
const BUILT_AT = __BUILT_AT__;
const BEST = __BEST_MONTHS_JSON__;
const VOL = __VOLATILITY_JSON__;
const TEXT = {
  fr: {
    title: "Mes stratégies", other: "English", other_href: "home.html", locale: "fr-FR",
    rule_link: "Règle en vigueur →", rule_href: "regle_en_vigueur.html",
    vol_link: "Volatilité →", vol_href: "volatilite.html", vol_name: "Volatilité",
    vol_title: "Volatilité — par jour d'achat",
    vol_intro: (each, target) => `Chaque jour, une vague achète les 39 actions de la liste pour ${each} chacune ; chaque action est vendue seule dès qu'elle a rapporté ${target} nets. Une ligne par vague : les jours ne se mélangent pas. Clique sur un jour pour voir ses actions.`,
    vol_head: ["Jour d'achat", "Objectif atteint", "Encore détenues", "Gains encaissés", "Gain net en cours", "Total", "Plus rapide", "Plus lente (vendue)"],
    vol_today: "aujourd'hui",
    override_warn: (c, a) => `⚠ Aujourd'hui, le marché est sous sa moyenne de 50 séances (S&P 500 ${c}, moyenne ${a}). Les listes sont faites quand même, à ta demande ; en temps normal elles seraient vides. Les stratégies concernées portent ⚠.`,
    intro: "Chaque ligne est une façon de suivre les listes, avec ses propres heures d'achat et de vente (heures de New York et de Paris). Clique sur un nom pour ouvrir son tableau de bord. Les chiffres sont après frais ; « depuis le 16 octobre » cumule chaque séance terminée.",
    head: ["Stratégie", "Achat → vente", "Aujourd'hui · PER < 25", "Aujourd'hui · PER < 25 · sans stop/objectif", "Aujourd'hui · sans PER", "Aujourd'hui · sans PER · sans stop/objectif", "Aujourd'hui · Nasdaq (7)", "Depuis le 16 oct. · PER < 25", "Depuis le 16 oct. · PER < 25 · sans stop/objectif", "Depuis le 16 oct. · sans PER", "Depuis le 16 oct. · sans PER · sans stop/objectif", "Depuis le 16 oct. · Nasdaq (7)", "Séances"],
    waiting: "en attente", none: "—", no_list: "pas de liste", next_day: " (lendemain)", later: k => ` (${k} séances plus tard)`, or_at: "ou",
    updated: t => `Mise à jour à ${t} (Paris) — la page se recharge toute seule chaque minute pendant la séance.`,
    list_at: t => `liste ${t}`, bought_at: t => `prix attendu`, sold: "vendu",
    best_title: "La meilleure stratégie de chaque mois",
    best_intro: "Pour chaque mois testé, la stratégie (et sa liste) qui a le plus rapporté après frais : à gauche avec ses règles de vente (stop et objectif), à droite sans stop ni objectif. Le montant est investi à chaque achat ; une stratégie gardée plusieurs séances le partage en tranches.",
    best_year: "Année :", best_amount: "Montant :", best_selection: "Actions par liste :",
    best_selections: { full: "Liste entière (jusqu'à 20)", top7: "Les 7 meilleures (en tête de liste)" },
    best_top_note: " « Les 7 meilleures » : chaque jour, seules les 7 premières actions de la liste, dans l'ordre de la liste (connu avant l'achat : hausse de la dernière heure, de la semaine ou repli le plus profond selon la stratégie), avec le même montant réparti sur elles.",
    best_head: ["Mois", "Avec limites (stop / objectif)", "Rendement", "Gain", "Sans limites", "Rendement", "Gain"],
    best_list: { per12: "PER < 25", sans_per: "sans PER" }, best_days: (d, n) => `${d}/${n} séances avec une liste`,
    best_total: "Toute l'année, en passant chaque mois à la gagnante",
    best_none: "Aucune stratégie n'a acheté ce mois-là (marché en mauvaise forme)",
    best_note: "Attention : la gagnante de chaque mois n'est connue qu'après coup. Elle change presque chaque mois, et plusieurs gagnantes d'un mois perdent sur l'année : la dernière ligne n'est pas atteignable en réalité. Diagnostic sur le passé, avant impôts.",
    best_big: " Avec 1 million $, les ordres pèseraient lourd face aux échanges de quelques minutes : les frais réels seraient bien plus élevés.",
    note: "Aujourd'hui : en direct pendant la séance (prix avec 15 min de retard), figé à l'heure de vente. Colonnes « sans stop/objectif » (en gris) : le même résultat si chaque titre était gardé jusqu'à l'heure de vente, sans la vente à −1,5 % ni à +3 % — pour voir ce que la règle rapporte ou coûte. Toutes ces stratégies sont des diagnostics en papier : aucun ordre n'est passé.",
  },
  en: {
    title: "My strategies", other: "Français", other_href: "accueil.html", locale: "en-US",
    rule_link: "Rule in force →", rule_href: "regle_en_vigueur_en.html",
    vol_link: "Volatility →", vol_href: "volatility_en.html", vol_name: "Volatility",
    vol_title: "Volatility — by day bought",
    vol_intro: (each, target) => `Each day, a batch buys the list's 39 stocks for ${each} each; each stock is sold on its own once it has made ${target} net. One row per batch: days are never mixed. Click a day to see its stocks.`,
    vol_head: ["Day bought", "Target reached", "Still held", "Gains banked", "Current net gain", "Total", "Fastest", "Slowest (sold)"],
    vol_today: "today",
    override_warn: (c, a) => `⚠ Today the market is below its 50-session average (S&P 500 ${c}, average ${a}). Lists are made anyway, at your request; normally they would be empty. The strategies concerned carry ⚠.`,
    intro: "Each row is a way of following the lists, with its own buying and selling times (New York and Paris times). Click a name to open its dashboard. Figures are after costs; \"since Oct 16\" compounds every completed session.",
    head: ["Strategy", "Buy → sell", "Today · P/E < 25", "Today · P/E < 25 · no stop/target", "Today · without P/E", "Today · without P/E · no stop/target", "Today · Nasdaq (7)", "Since Oct 16 · P/E < 25", "Since Oct 16 · P/E < 25 · no stop/target", "Since Oct 16 · without P/E", "Since Oct 16 · without P/E · no stop/target", "Since Oct 16 · Nasdaq (7)", "Sessions"],
    waiting: "waiting", none: "—", no_list: "no list", next_day: " (next day)", later: k => ` (${k} sessions later)`, or_at: "or",
    updated: t => `Updated at ${t} (Paris) — the page reloads itself every minute during the session.`,
    list_at: t => `list ${t}`, bought_at: t => `price pending`, sold: "sold",
    best_title: "The best strategy each month",
    best_intro: "For each month tested, the strategy (and its list) that made the most after costs: on the left with its selling rules (stop and target), on the right with no stop or target. The amount is invested at each purchase; a strategy held several sessions splits it into slices.",
    best_year: "Year:", best_amount: "Amount:", best_selection: "Stocks per list:",
    best_selections: { full: "Full list (up to 20)", top7: "Best 7 (top of the list)" },
    best_top_note: " \"Best 7\": each day, only the first 7 stocks of the list, in the list's order (known before buying: last-hour rise, weekly rise or deepest dip depending on the strategy), with the same amount split across them.",
    best_head: ["Month", "With limits (stop / target)", "Return", "Gain", "Without limits", "Return", "Gain"],
    best_list: { per12: "P/E < 25", sans_per: "without P/E" }, best_days: (d, n) => `${d}/${n} sessions with a list`,
    best_total: "Whole year, switching each month to the winner",
    best_none: "No strategy bought that month (market in poor shape)",
    best_note: "Warning: each month's winner is only known afterwards. It changes almost every month, and several monthly winners lose over the year: the last row cannot be reached in reality. Diagnostic on past data, before tax.",
    best_big: " With $1 million, the orders would weigh heavily against a few minutes of trading: real costs would be much higher.",
    note: "Today: live during the session (prices 15 min late), frozen at the selling time. \"No stop/target\" columns (grey background): the same result if every stock were kept until the selling time, without the −1.5% or +3% sale — to see what the rule gains or costs. All these strategies are paper diagnostics: no order is placed.",
  },
}[LANG];
const pct = v => new Intl.NumberFormat(TEXT.locale, { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "exceptZero" }).format(v);
const cell = (v, extra) => {
  const td = document.createElement("td");
  td.className = v == null ? (extra === TEXT.none ? "num" : "state") : "num" + (v > 0 ? " up" : v < 0 ? " down" : "");
  td.textContent = v == null ? extra : pct(v);
  return td;
};
document.documentElement.lang = LANG;
document.title = TEXT.title;
document.getElementById("title").textContent = TEXT.title;
const other = document.getElementById("other");
other.textContent = TEXT.other; other.href = TEXT.other_href;
Object.assign(document.getElementById("rule-link"), { textContent: TEXT.rule_link, href: TEXT.rule_href });
Object.assign(document.getElementById("vol-link"), { textContent: TEXT.vol_link, href: TEXT.vol_href });
// Résumé d'un autre format (suivi lancé avec un code plus ancien) : la section reste cachée, le reste de la page s'affiche.
if (VOL && Array.isArray(VOL.batches)) {
  document.getElementById("vol").hidden = false;
  const usd = v => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", signDisplay: "exceptZero" }).format(v);
  const plain = v => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v);
  const span = s => s == null ? "—" : s < 3600 ? `${Math.round(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h ${String(Math.round(s % 3600 / 60)).padStart(2, "0")}` : `${(s / 86400).toFixed(1)} ${LANG === "fr" ? "j" : "days"}`;
  const title = document.getElementById("vol-title");
  const link = document.createElement("a"); link.href = TEXT.vol_href; link.textContent = TEXT.vol_title; title.appendChild(link);
  document.getElementById("vol-intro").textContent = TEXT.vol_intro(plain(+VOL.amount_per_stock), plain(+VOL.target_gain));
  const vt = document.getElementById("vol-table");
  const vh = vt.createTHead().insertRow();
  TEXT.vol_head.forEach((h, i) => { const th = document.createElement("th"); th.textContent = h; if (i === 0) th.className = "text"; vh.appendChild(th); });
  const vb = vt.createTBody();
  const nyToday = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const money = v => { const td = document.createElement("td"); td.className = "num" + (v > 0 ? " up" : v < 0 ? " down" : ""); td.textContent = usd(v); return td; };
  const plainCell = v => { const td = document.createElement("td"); td.className = "num"; td.textContent = v; return td; };
  VOL.batches.forEach(b => {
    const tr = vb.insertRow();
    const name = document.createElement("td"); name.className = "text";
    const a = document.createElement("a"); a.href = `${TEXT.vol_href}#${b.day}`;
    a.textContent = new Date(b.entry_time).toLocaleDateString(TEXT.locale, { timeZone: "America/New_York", day: "numeric", month: "long" }) + (b.day === nyToday ? ` (${TEXT.vol_today})` : "");
    name.appendChild(a); tr.appendChild(name);
    tr.append(plainCell(`${b.sold} / ${b.n}`), plainCell(b.held), money(+b.banked), money(+b.open_gain), money(+b.banked + +b.open_gain),
              plainCell(span(b.fastest)), plainCell(span(b.slowest)));
  });
}
const flagged = ROWS.find(r => r.unhealthy_today);
const banner = document.getElementById("override-warn");
if (flagged) { banner.hidden = false; banner.textContent = TEXT.override_warn(`$${flagged.unhealthy_today.market_close}`, `$${flagged.unhealthy_today.market_average}`); }
document.getElementById("intro").textContent = TEXT.intro;
document.getElementById("note").textContent = TEXT.note;
document.getElementById("updated").textContent = TEXT.updated(
  new Date(BUILT_AT).toLocaleTimeString(TEXT.locale, { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }));
const t = document.getElementById("rows");
const head = t.createTHead().insertRow();
TEXT.head.forEach((h, i) => { const th = document.createElement("th"); th.textContent = h; th.className = i < 2 ? "text" : [3, 5, 8, 10].includes(i) ? "alt" : ""; head.appendChild(th); });
const body = t.createTBody();
ROWS.forEach(r => {
  const tr = body.insertRow();
  const name = document.createElement("td"); name.className = "text";
  const a = document.createElement("a"); a.href = LANG === "fr" ? r.fr : r.en; a.textContent = LANG === "fr" ? r.name : r.name_en;
  const d = document.createElement("div"); d.className = "desc"; d.textContent = LANG === "fr" ? r.description : r.description_en;
  name.append(a, d); tr.appendChild(name);
  if (r.unhealthy_today) { const f = document.createElement("span"); f.className = "flag"; f.textContent = " ⚠"; f.title = TEXT.override_warn(r.unhealthy_today.market_close, r.unhealthy_today.market_average); a.after(f); }
  // New York sur la première ligne, Paris en dessous : la colonne reste étroite.
  const times = document.createElement("td"); times.className = "text num"; const next = r.sale_offset > 1 ? TEXT.later(r.sale_offset) : r.next_day ? TEXT.next_day : "";
  const paris = document.createElement("div"); paris.className = "desc";
  // Bascule : deux heures d'achat possibles (« 15:00 ou 15:55 »).
  const alt = (t, a) => a ? `${t} ${TEXT.or_at} ${a}` : t;
  paris.textContent = `${alt(r.buy_paris, r.buy_alt_paris)} → ${r.sell_paris}${next} Paris`;
  times.textContent = `${alt(r.buy, r.buy_alt)} → ${r.sell}${next} New York`;
  times.appendChild(paris); tr.appendChild(times);
  // Aujourd'hui : la liste n'est pas encore produite → son heure ; produite mais prix d'achat pas encore servi →
  // heure d'achat ; liste vide → « pas de liste » ; sinon le résultat en direct (« vendu » une fois figé).
  ["per12", "sans_per"].forEach(v => {
    const today = r.today[v];
    const n = r.lists_today[v];
    const td = cell(today?.net ?? null,
      n === undefined ? TEXT.list_at(r.buy_paris) : n === 0 ? TEXT.no_list : TEXT.bought_at(r.buy_paris));
    if (today?.net != null && today.status === "closed") td.textContent += ` · ${TEXT.sold}`;
    tr.appendChild(td);
    const alt = cell(today?.net_no_rule ?? null, TEXT.none); alt.classList.add("alt"); tr.appendChild(alt);
  });
  // Liste Nasdaq (7 actions, toujours complète) : aujourd'hui.
  { const today = r.today.nasdaq; const n = r.lists_today.nasdaq;
    const td = cell(today?.net ?? null, n === undefined ? TEXT.list_at(r.buy_paris) : n === 0 ? TEXT.no_list : TEXT.bought_at(r.buy_paris));
    if (today?.net != null && today.status === "closed") td.textContent += ` · ${TEXT.sold}`;
    tr.appendChild(td); }
  ["per12", "sans_per"].forEach(v => {
    tr.appendChild(cell(r.totals[v]?.total ?? null, TEXT.none));
    const alt = cell(r.totals[v + "_sans_regle"]?.total ?? null, TEXT.none); alt.classList.add("alt"); tr.appendChild(alt);
  });
  tr.appendChild(cell(r.totals.nasdaq?.total ?? null, TEXT.none));
  const n = document.createElement("td"); n.className = "num"; n.textContent = r.totals.per12?.n ?? r.totals.sans_per?.n ?? 0; tr.appendChild(n);
});

// La meilleure stratégie de chaque mois (tests sur le passé) : année et montant choisis, gardés dans ce navigateur.
(() => {
  const years = Object.keys(BEST.full || {}).sort().reverse();   // la plus récente d'abord
  if (!years.length) { document.querySelector(".best").hidden = true; return; }
  const amounts = [10000, 25000, 100000, 1000000];
  const usd = v => new Intl.NumberFormat(TEXT.locale, { style: "currency", currency: "USD", maximumFractionDigits: 0, signDisplay: "exceptZero" }).format(v);
  const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const selection = document.getElementById("best-selection");
  Object.keys(BEST).forEach(k => selection.add(new Option(TEXT.best_selections[k] || k, k)));
  selection.value = BEST[recall("best-selection")] ? recall("best-selection") : "full";
  document.getElementById("best-selection-label").textContent = TEXT.best_selection;
  const year = document.getElementById("best-year"), amount = document.getElementById("best-amount");
  years.forEach(y => year.add(new Option(y, y)));
  amounts.forEach(a => amount.add(new Option(usd(a).replace("+", ""), a)));
  year.value = years.includes(recall("best-year")) ? recall("best-year") : years[0];
  amount.value = amounts.map(String).includes(recall("best-amount")) ? recall("best-amount") : "10000";
  ["title", "intro"].forEach(k => document.getElementById(`best-${k}`).textContent = TEXT[`best_${k}`]);
  document.getElementById("best-year-label").textContent = TEXT.best_year;
  document.getElementById("best-amount-label").textContent = TEXT.best_amount;
  const pages = Object.fromEntries(ROWS.map(r => [r.id, LANG === "fr" ? r.fr : r.en]));
  const draw = () => {
    const a = Number(amount.value), rows = (BEST[selection.value] || {})[year.value] || [];
    const t = document.getElementById("best-table");
    t.replaceChildren();
    const head = t.createTHead().insertRow();
    TEXT.best_head.forEach((h, i) => { const th = document.createElement("th"); th.textContent = h; th.className = [0, 1, 4].includes(i) ? "text" : ""; head.appendChild(th); });
    const body = t.createTBody();
    const cells = (tr, pick) => {
      const name = document.createElement("td"); name.className = "text";
      if (pick.return === 0 && pick.days === 0) {
        // Mois sans aucun achat, toutes stratégies confondues (règle « marché en bonne forme »).
        name.textContent = TEXT.best_none; name.classList.add("state"); tr.appendChild(name);
      } else {
        const link = document.createElement("a"); link.href = pages[pick.strategy] || "#";
        link.textContent = `${pick.order}. ${LANG === "fr" ? pick.name : pick.name_en}`;
        const d = document.createElement("div"); d.className = "desc";
        d.textContent = `${TEXT.best_list[pick.list]} · ${TEXT.best_days(pick.days, pick.sessions)}`;
        name.append(link, d); tr.appendChild(name);
      }
      tr.appendChild(cell(pick.return, TEXT.none));
      const gain = document.createElement("td"); gain.className = "num " + (pick.return > 0 ? "up" : pick.return < 0 ? "down" : "");
      gain.textContent = usd(a * pick.return); tr.appendChild(gain);
    };
    let withTotal = 1, withoutTotal = 1;
    rows.forEach(r => {
      const tr = body.insertRow();
      const m = document.createElement("td"); m.className = "text";
      m.textContent = new Date(`${r.month}-15T12:00:00Z`).toLocaleDateString(TEXT.locale, { month: "long", timeZone: "UTC" });
      tr.appendChild(m);
      cells(tr, r.with); cells(tr, r.without);
      withTotal *= 1 + r.with.return; withoutTotal *= 1 + r.without.return;
    });
    const tr = body.insertRow(); tr.className = "total";
    const label = document.createElement("td"); label.className = "text"; label.textContent = TEXT.best_total; tr.appendChild(label);
    [withTotal - 1, withoutTotal - 1].forEach(v => {
      tr.appendChild(document.createElement("td"));
      tr.appendChild(cell(v, TEXT.none));
      const gain = document.createElement("td"); gain.className = "num " + (v > 0 ? "up" : "down"); gain.textContent = usd(a * v); tr.appendChild(gain);
    });
    document.getElementById("best-note").textContent = TEXT.best_note + (selection.value === "top7" ? TEXT.best_top_note : "")
      + (a >= 1000000 ? TEXT.best_big : "");
  };
  year.onchange = () => { remember("best-year", year.value); draw(); };
  amount.onchange = () => { remember("best-amount", amount.value); draw(); };
  selection.onchange = () => { remember("best-selection", selection.value); draw(); };
  draw();
})();
</script>
</body>
</html>
