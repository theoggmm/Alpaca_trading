<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpaca Trading Dashboard</title>
    <style>
        :root { --bg-light: #f8f9fa; --accent: #0066cc; --border-light: #e0e0e0; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-light: #1a1a1a; --accent: #3385ff; --border-light: #333; color-scheme: dark; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-light); color: #2c3e50; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
        html, body { height: 100%; }
        .container { max-width: 400px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: center; }
        .login-page { width: 100%; display: none; }
        .login-page.active { display: block; }
        .login-form { background: var(--bg-light); padding: 40px 30px; border-radius: 8px; border: 1px solid var(--border-light); text-align: center; }
        .login-form h1 { font-size: 28px; margin-bottom: 10px; color: white; }
        .login-form p { margin-bottom: 30px; opacity: 0.8; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 16px; background: var(--bg-light); color: #2c3e50; }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .login-btn:hover { background: #1562cc; }
        .error-message { color: #e74c3c; font-size: 14px; margin-top: 15px; display: none; }
        .error-message.show { display: block; }
        .dashboard-page { width: 100%; display: none; height: 100%; }
        .dashboard-page.active { display: flex; }
        .dashboard-wrapper { width: 100%; height: 100%; display: flex; gap: 0; }
        .sidebar { width: 150px; background: #2c3e50; display: flex; flex-direction: column; gap: 10px; padding: 20px 10px; border-radius: 8px 0 0 8px; }
        .tab-btn { padding: 15px; background: #34495e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .tab-btn:hover { transform: scale(1.05); }
        .tab-btn.active { transform: scale(1.1); }
        .dashboard { flex: 1; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
        .dashboard h2 { color: white; font-size: 32px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); }
        .dashboard p { color: rgba(255, 255, 255, 0.9); font-size: 18px; margin-bottom: 40px; }
        .logout-btn { padding: 12px 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .dashboard.red { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .dashboard.orange { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .dashboard.green { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .dashboard.purple { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-page active">
            <div class="login-form">
                <h1>Alpaca Trading</h1>
                <p>Connectez-vous à votre tableau de bord</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Identifiant</label>
                        <input type="password" id="username" placeholder="••••••••" required />
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>
                    <button type="submit" class="login-btn">Connexion</button>
                    <div class="error-message" id="errorMessage"></div>
                </form>
            </div>
        </div>
        <div class="dashboard-page">
            <div class="dashboard-wrapper">
                <div class="sidebar">
                    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
                    <button class="tab-btn" data-tab="account">Online Account</button>
                    <button class="tab-btn" data-tab="watchlist">Watchlist</button>
                    <button class="tab-btn" data-tab="calendar">Calendar</button>
                    <button class="logout-btn" id="logoutBtn" style="margin-top: auto;">Déconnexion</button>
                </div>
                <div class="dashboard red" id="tab-dashboard">
                    <h2>Dashboard 📊</h2>
                    <p>Bienvenue sur votre tableau de bord</p>
                </div>
                <div class="dashboard orange" id="tab-account" style="display: none;">
                    <h2>Online Account 💳</h2>
                    <p>Gestion de votre compte en ligne</p>
                </div>
                <div class="dashboard green" id="tab-watchlist" style="display: none;">
                    <h2>Watchlist 👀</h2>
                    <p>Vos actions en surveillance</p>
                </div>
                <div class="dashboard purple" id="tab-calendar" style="display: none;">
                    <h2>Calendar 📅</h2>
                    <p>Calendrier des événements</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const CORRECT_USERNAME = "meyer.theodore";
        const CORRECT_PASSWORD = "10qpalzmOC";
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("errorMessage");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginPage = document.querySelector(".login-page");
        const dashboardPage = document.querySelector(".dashboard-page");
        const tabBtns = document.querySelectorAll(".tab-btn");

        function checkLoggedIn() {
            if (localStorage.getItem("alpacaLoggedIn") === "true") {
                showDashboard();
            }
        }

        function showDashboard() {
            loginPage.classList.remove("active");
            dashboardPage.classList.add("active");
        }

        function showLogin() {
            loginPage.classList.add("active");
            dashboardPage.classList.remove("active");
            usernameInput.value = "";
            passwordInput.value = "";
            errorMessage.classList.remove("show");
        }

        tabBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const tabId = btn.getAttribute("data-tab");
                tabBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll("[id^='tab-']").forEach(tab => tab.style.display = "none");
                document.getElementById(`tab-${tabId}`).style.display = "flex";
            });
        });

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                localStorage.setItem("alpacaLoggedIn", "true");
                showDashboard();
            } else {
                errorMessage.textContent = "Identifiant ou mot de passe incorrect";
                errorMessage.classList.add("show");
                passwordInput.value = "";
            }
        });

        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("alpacaLoggedIn");
            showLogin();
        });

        checkLoggedIn();
    </script>
</body>
</html>
