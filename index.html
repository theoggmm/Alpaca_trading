<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpaca Trading Dashboard</title>
    <style>
        :root { --bg-light: #f8f9fa; --accent: #0066cc; --border-light: #e0e0e0; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-light: #1a1a1a; --accent: #3385ff; --border-light: #333; color-scheme: dark; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-light); color: #2c3e50; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
        html, body { height: 100%; }
        .container { max-width: 400px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: center; }
        .login-page { width: 100%; display: none; }
        .login-page.active { display: block; }
        .login-form { background: var(--bg-light); padding: 40px 30px; border-radius: 8px; border: 1px solid var(--border-light); text-align: center; }
        .login-form h1 { font-size: 28px; margin-bottom: 10px; color: var(--accent); }
        .login-form p { margin-bottom: 30px; opacity: 0.8; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 16px; background: var(--bg-light); color: #2c3e50; }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .login-btn:hover { background: #1562cc; }
        .error-message { color: #e74c3c; font-size: 14px; margin-top: 15px; display: none; }
        .error-message.show { display: block; }
        .dashboard-page { width: 100%; display: none; height: 100%; }
        .dashboard-page.active { display: flex; align-items: center; justify-content: center; }
        .dashboard { width: 100%; height: 100%; background: linear-gradient(135deg, #1e90ff 0%, #4169e1 100%); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
        .dashboard h2 { color: white; font-size: 32px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); }
        .dashboard p { color: rgba(255, 255, 255, 0.9); font-size: 18px; margin-bottom: 40px; }
        .logout-btn { padding: 12px 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-page active">
            <div class="login-form">
                <h1>Alpaca Trading</h1>
                <p>Connectez-vous à votre tableau de bord</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Identifiant</label>
                        <input type="text" id="username" placeholder="meyer.theodore" required />
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>
                    <button type="submit" class="login-btn">Connexion</button>
                    <div class="error-message" id="errorMessage"></div>
                </form>
            </div>
        </div>
        <div class="dashboard-page">
            <div class="dashboard">
                <h2>Bienvenue! 🚀</h2>
                <p>Vous êtes connecté à votre tableau de bord Alpaca Trading</p>
                <button class="logout-btn" id="logoutBtn">Déconnexion</button>
            </div>
        </div>
    </div>
    <script>
        const CORRECT_USERNAME = "meyer.theodore";
        const CORRECT_PASSWORD = "10qpalzmOC";
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("errorMessage");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginPage = document.querySelector(".login-page");
        const dashboardPage = document.querySelector(".dashboard-page");
        
        function checkLoggedIn() {
            if (localStorage.getItem("alpacaLoggedIn") === "true") {
                showDashboard();
            }
        }
        
        function showDashboard() {
            loginPage.classList.remove("active");
            dashboardPage.classList.add("active");
        }
        
        function showLogin() {
            loginPage.classList.add("active");
            dashboardPage.classList.remove("active");
            usernameInput.value = "";
            passwordInput.value = "";
            errorMessage.classList.remove("show");
        }
        
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                localStorage.setItem("alpacaLoggedIn", "true");
                showDashboard();
            } else {
                errorMessage.textContent = "Identifiant ou mot de passe incorrect";
                errorMessage.classList.add("show");
                passwordInput.value = "";
            }
        });
        
        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("alpacaLoggedIn");
            showLogin();
        });
        
        checkLoggedIn();
    </script>
</body>
</html>
