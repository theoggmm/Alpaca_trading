[project]
name = "alpaca-trading"
version = "0.1.0"
description = "Passage d'ordres sur Alpaca via l'API"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "gunicorn>=22.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
